<html lang="zh-Hans">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字体样本册</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f2;--paper:#fcfcfa;--fg:#191919;--muted:#64645e;--line:#d4d4cc;--ok:#32764a;--warn:#8c6327}
*{box-sizing:border-box}html{scroll-behavior:auto}body{background:var(--bg);color:var(--fg);margin:0;font:13px/1.5 system-ui,sans-serif}header,main,footer{width:min(1840px,100%);margin:auto;padding:18px}header{padding-bottom:6px}h1{font-size:24px;line-height:1.2;margin:0 0 8px;font-weight:600;letter-spacing:-.025em}header p{max-width:90ch;margin:5px 0;color:var(--muted)}#summary{font-variant-numeric:tabular-nums}main{padding-top:6px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.family{border-top:1px solid var(--line);padding:14px 0 18px;min-width:0}.family-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:7px}.family h2{font-size:16px;line-height:1.4;margin:0;overflow-wrap:anywhere;font-weight:600}.metadata{color:var(--muted);font-size:11px;margin:3px 0;overflow-wrap:anywhere}.load-status{font-size:11px;color:var(--muted);white-space:normal}.load-status[data-state=loaded]{color:var(--ok)}.load-status[data-state=failed]{color:var(--warn)}.coverage{color:var(--muted);font-size:11px;margin:0 0 9px;overflow-wrap:anywhere}.variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.family[data-single=true] .variants{grid-template-columns:1fr}.variant{background:var(--paper);border:1px solid var(--line);padding:12px;min-width:0}.variant-label{font:500 11px/1.5 system-ui,sans-serif;margin:0 0 8px;color:var(--muted);font-variant-numeric:tabular-nums}.specimen{font-size:16px;line-height:1.75;font-weight:400;font-style:normal;font-stretch:normal;font-synthesis:none;letter-spacing:normal;overflow-wrap:anywhere;min-width:0}.specimen h3{font-family:inherit;font-weight:inherit;font-size:24px;line-height:1.65;margin:0 0 7px;letter-spacing:inherit}.specimen p{margin:0 0 8px}.specimen ul{margin:0 0 8px;padding-left:1.2em}.specimen li{padding-left:.12em;margin:1px 0}.specimen .details{font-size:13px;line-height:1.8;margin:0}.supplement{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}.supplement-label{font:11px/1.5 system-ui,sans-serif;color:var(--muted);margin:0 0 2px}.specimen .supplement-text{margin:0;font-size:19px;line-height:1.8;overflow-wrap:anywhere}footer{font-size:11px;color:var(--muted);padding-top:0}.error{border:1px solid var(--line);padding:18px;overflow-wrap:anywhere}.error strong{color:var(--warn)}.reopen{font-size:12px}.reopen code{user-select:all;overflow-wrap:anywhere}.restricted{color:var(--warn);font-size:11px;margin:4px 0 8px}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--paper:#202020;--fg:#edede8;--muted:#aaa9a0;--line:#45453f;--ok:#8bc59b;--warn:#d4b477}}
@media(min-width:1101px) and (max-width:1450px){.variants{grid-template-columns:1fr}}
@media(max-width:1100px){main{grid-template-columns:1fr}}
@media(max-width:650px){header,main,footer{padding:12px}.variants{grid-template-columns:1fr}.variant{padding:11px}.family{padding-bottom:12px}.family h2{font-size:15px}}

.group-heading{grid-column:1/-1;margin:12px 0 0;padding:8px 0;border-bottom:2px solid var(--line);font:600 18px/1.4 system-ui,sans-serif}.family[data-emoji-only=true]{grid-column:1/-1}.emoji-sheet{font-size:38px;line-height:1.8;letter-spacing:.12em;white-space:pre-wrap;margin:0}.emoji-note{font:12px/1.6 system-ui,sans-serif;color:var(--muted)}
</style>
<header>
  <h1 id="title">字体样本册</h1>
  <p id="description">每个字体与样式都直接展开。用标题、段落、列表和数字混排比较实际阅读感，向下滚动即可。</p>
  <p id="summary" role="status">正在读取本地字体目录…</p>
</header>
<main id="catalog" aria-label="全部字体与样式"></main>
<footer id="footnote">样本从随附字体文件加载，不使用本机同名字体。缺失字符可能由系统后备字体显示；覆盖标签来自目录记录，页面可见字符本身不代表该字体已内嵌。</footer>

  },
  en:{
    groupGeist:'Favorites · Geist Pixel / Mono',groupMixed:'Favorites · GeistMixed',groupEmoji:'Noto 3D Emoji · Separate specimen',groupOther:'Other retained fonts',emojiNotice:'Existing UI subset: 120 original PNGs, not full emoji coverage. Missing characters may still use system fallback.',
    reopen:'Reopen anytime',restricted:'Local experimental font · Redistribution requires the source project’s permission review',
    title:'Font specimen book',fullTitle:'Custom font specimen book',webTitle:'Doto Tall · All heights of four families',
    description:'Every font and style is expanded. Compare headings, paragraphs, lists, and numbers at a glance; scroll to see the rest.',
    catalogAria:'All fonts and styles',reading:'Reading the local font catalog…',
    footnote:'Samples load the supplied font files without using installed namesakes. Missing characters may use system fallback. Coverage labels come from the catalog; a visible character alone does not prove that it is embedded.',
    embedded:'Embedded',partial:'Partly embedded',fallback:'System fallback',unknown:'Unconfirmed',
    height:'{value}% height',appWeight:'Application weight {value}',sourceWeight:'Source weight {value}',width:'Text width {value}%',
    loading:'Loading font file…',loaded:'Supplied font loaded',fontFailed:'Load failed · Showing system fallback',
    coverageUnknown:'Text coverage is unconfirmed; visible characters may use system fallback.',nerd:'Nerd icons',hangul:'Korean',
    count:'{fonts} {fontUnit} · {styles} {styleUnit} · All expanded',missing:' · {count} {fontUnit} not loaded',allLoaded:' · All supplied fonts loaded',

    labels:{'彩色字体；序列另验':'Color font; sequences checked separately','样例码位；系统可能补字':'Sample codepoints; system fallback may supply missing characters','系统可能补字；序列另验':'System fallback may supply missing characters; sequences checked separately','DeparturePixelZh · 已有 Nerd 图标组合':'DeparturePixelZh · Existing Nerd icon combo','Geist Pixel · 当前来源文件':'Geist Pixel · Current source file','Roboto Combo · 已有字体资产':'Roboto Combo · Existing font assets','候选来源，未用于替换现有 Cubic 中文':'Candidate source; does not replace existing Cubic Chinese','原始 Doto · 字重命名样式':'Original Doto · Named weight styles','Doto 原版可变字体':'Original Doto variable font','Fusion Pixel · 可选补字源对比':'Fusion Pixel · Optional coverage source comparison'}
  }
};
function selectLocale(override,browserLanguage){
  if(['zh-Hans','zh-Hant','en'].includes(override))return override;
  const language=String(browserLanguage||'en').toLowerCase();
  if(/^zh(?:-|$)/.test(language))return /(?:^|-)(?:hant|tw|hk|mo)(?:-|$)/.test(language)?'zh-Hant':'zh-Hans';
  return 'en';
}
const locale=selectLocale(new URLSearchParams(location.search).get('lang'),navigator.language);
const strings=translations[locale];
function t(key,values={}){return strings[key].replace(/\{(\w+)\}/g,(_,name)=>String(values[name]??''));}
function translatedLabel(value){return strings.labels[value]||strings.coverageLabels[value]||value;}
function localizedError(key,values){const error=new Error(t(key,values));error.localized=true;return error;}
const statusLabels=Object.fromEntries(['embedded','partial','fallback','unknown'].map(key=>[key,t(key)]));
document.documentElement.lang=locale;
document.title=t('title');document.querySelector('#title').textContent=document.title;
document.querySelector('#description').textContent=t('description');
document.querySelector('#catalog').setAttribute('aria-label',t('catalogAria'));
document.querySelector('#footnote').textContent=t('footnote');
document.querySelector('#summary').textContent=t('reading');
const catalogElement=document.querySelector('#catalog');
const summary=document.querySelector('#summary');
function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
function coordinatesLabel(coordinates){return Object.entries(coordinates).map(([axis,value])=>axis==='HGHT'?t('height',{value}):`${axis} ${value}`).join(' · ');}
function variationSettings(coordinates){return Object.entries(coordinates).map(([axis,value])=>`"${axis}" ${value}`).join(', ')||'normal';}
function addSupplement(specimen,label,text){const area=element('div','supplement');area.append(element('div','supplement-label',label),element('p','supplement-text',text));specimen.append(area);}
function specimenCard(family,style,alias,index){
  const card=element('article','variant');card.dataset.family=family.family;card.dataset.style=style.name;
  const coordinates=style.coordinates||{};const heightLabel=coordinatesLabel(coordinates);
  card.append(element('h3','variant-label',style.label||[style.name,heightLabel].filter(Boolean).join(' · ')));
  const sample=element('div','specimen');sample.id=`specimen-${index}`;sample.style.fontFamily=`"${alias}", system-ui, sans-serif`;sample.style.fontWeight=String(family.metadataWeight||400);sample.style.fontVariationSettings=variationSettings(coordinates);
  const title=element('h3','title-probe','把日常，排成自己的样子');
  const paragraph=element('p','text-probe','清晨的光落在桌边，新的想法从一行字开始。把计划写清楚，也给灵感留一点空间。');
  const english=element('p','latin-probe','A small detail changes the rhythm of a page. Keep the useful things close, and let the words breathe.');
  const list=element('ul','list-probe');for(const text of ['阅读长段落，观察文字密度与行间节奏。','Compare headings, notes, and everyday lists.','中文简体 · 繁體中文 · ā á à · ㄅ ㄆ ㄇ'])list.append(element('li','',text));
  const details=element('p','details number-probe','2026.10.15 · 08:45 · 0123456789\n¥ 1,280.50 / $ 48.00 · 85%\n~/X/Project/font-preview_v2 · Aa Bb Gg Qq');details.style.whiteSpace='pre-line';
  if(family.emojiOnly){
    card.append(element('p','emoji-note',t('emojiNotice')));
    const sheet=element('p','emoji-sheet',family.emojiSample);sheet.style.fontFamily=`"${alias}", "Apple Color Emoji", sans-serif`;sheet.style.fontSynthesis='none';sheet.id=sample.id;card.append(sheet);return card;
  }
  sample.append(title,paragraph,english,list,details);
  if(family.emoji){const flag=family.emoji.status||'unknown';addSupplement(sample,`Emoji · ${statusLabels[flag]||statusLabels.unknown}${family.emoji.label?' · '+translatedLabel(family.emoji.label):''}`,'😀 ❤️ 👍🏽 👩‍💻 🇹🇼 1️⃣');}
  if(family.icons){const flag=family.icons.status||'unknown';addSupplement(sample,`${t('nerd')} · ${statusLabels[flag]||statusLabels.unknown}`,'\uE0B0 \uE0A0 \uF07B \uF120 \uF013');}
  if(family.hangul){const flag=family.hangul.status||'unknown';addSupplement(sample,`${t('hangul')} · ${statusLabels[flag]||statusLabels.unknown}`,'가나다라마바사 · 안녕하세요');}
  card.append(sample);return card;
}
async function render(){
  const response=await fetch('preview_catalog.json',{cache:'no-store'});if(!response.ok)throw localizedError('httpError',{status:response.status});const catalog=await response.json();
  if(catalog.schemaVersion!==1||!Array.isArray(catalog.families)||!catalog.families.length)throw localizedError('invalidCatalog');
  const webFamilies=['DotoMod700ZhRefinedTall','DotoMod700ZhRefinedTallCondensed','DotoMod700ZhRefinedTallEmojiMax','DotoMod700ZhRefinedTallCondensedEmojiMax'];
  const webKit=catalog.families.length===4&&catalog.families.every(family=>webFamilies.includes(family.family));
  document.title=t(webKit?'webTitle':'fullTitle');document.querySelector('#title').textContent=document.title;
  if(catalog.reopenCommand){const hint=element('p','reopen',t('reopen')+' · ');hint.append(element('code','',catalog.reopenCommand));document.querySelector('header').append(hint);}
  let count=0;const loads=[];let previousGroup=null;
  const grouped=catalog.families.some(family=>family.previewGroup);
  for(const [familyIndex,family]of catalog.families.entries()){
    const group=family.previewGroup||'other';if(grouped&&group!==previousGroup){catalogElement.append(element('h2','group-heading',t({geist:'groupGeist',mixed:'groupMixed',emoji:'groupEmoji',other:'groupOther'}[group])));previousGroup=group;}
    const section=element('section','family');section.dataset.emojiOnly=String(Boolean(family.emojiOnly));section.dataset.family=family.family;section.dataset.single=String(family.styles.length===1);const head=element('div','family-head');const identity=element('div');identity.append(element('h2','',translatedLabel(family.label||family.family)));
    const metadata=[family.family,t('appWeight',{value:family.metadataWeight||400})];if(family.sourceWeight!==null&&family.sourceWeight!==undefined)metadata.push(t('sourceWeight',{value:family.sourceWeight}));if(family.horizontalScale!==undefined)metadata.push(t('width',{value:Math.round(family.horizontalScale*100)}));if(family.sourceLabel)metadata.push(translatedLabel(family.sourceLabel));identity.append(element('p','metadata',metadata.join(' · ')));
    const loadStatus=element('span','load-status',t('loading'));loadStatus.dataset.state='loading';head.append(identity,loadStatus);section.append(head);
    const coverage=(family.coverage||[]).map(item=>`${translatedLabel(item.label)}${locale==='en'?': ':'：'}${statusLabels[item.status]||statusLabels.unknown}`).join(' · ');section.append(element('p','coverage',coverage||t('coverageUnknown')));
    if(family.distribution==='restricted')section.append(element('p','restricted',t('restricted')));
    const variants=element('div','variants');const alias=`FontPreview${familyIndex}`;
    for(const style of family.styles||[{name:'Regular',coordinates:{}}])variants.append(specimenCard(family,style,alias,count++));section.append(variants);catalogElement.append(section);
    loads.push(async()=>{try{for(const file of family.fontFiles||[{fontUrl:family.fontUrl}]){const fontUrl=new URL(file.fontUrl,location.href);if(fontUrl.origin!==location.origin)throw localizedError('localOnly');const descriptors={style:'normal',weight:String(family.metadataWeight||400),stretch:'normal',display:'swap'};if(file.unicodeRange)descriptors.unicodeRange=file.unicodeRange;document.fonts.add(new FontFace(alias,`url(${JSON.stringify(fontUrl.href)})`,descriptors));}await document.fonts.load(`${family.metadataWeight||400} 16px ${alias}`,variants.textContent).then(()=>{loadStatus.textContent=t('loaded');loadStatus.dataset.state='loaded';},error=>{loadStatus.textContent=t('fontFailed');loadStatus.dataset.state='failed';loadStatus.title=String(error);return false;});}catch(error){loadStatus.textContent=t('fontFailed');loadStatus.dataset.state='failed';loadStatus.title=String(error);return false;}});
  }
  summary.textContent=t('count',{fonts:catalog.families.length,styles:count,fontUnit:catalog.families.length===1?'font':'fonts',styleUnit:count===1?'style':'styles'});
  // Three font families at a time avoid simultaneous decoding of every large CJK file.
  await Promise.all(Array.from({length:Math.min(3,loads.length)},async()=>{while(loads.length)await loads.shift()();}));await document.fonts.ready;const failed=document.querySelectorAll('[data-state="failed"]').length;summary.textContent+=failed?t('missing',{count:failed,fontUnit:failed===1?'font file':'font files'}):t('allLoaded');document.documentElement.dataset.previewReady=failed?'partial':'true';
}
render().catch(error=>{summary.textContent=t('incomplete');catalogElement.replaceChildren();const message=element('p','error');message.append(element('strong','',error.localized?error.message:t('catalogError')),element('br'),document.createTextNode(t('help')));catalogElement.append(message);document.documentElement.dataset.previewReady='error';});
</script>
